<main class="section" id="content" tabindex="-1">
  <article class="post-detail project-detail">
    <header class="section-header">
      <p class="post-category">Project</p>
      <h1>$title</h1>
      <p class="post-subtitle">$description</p>
      <p class="project-technologies">$technologies</p>
    </header>
    <div class="post-columns">
      <section class="post-body" aria-label="Project overview">
$body
      </section>
      <aside class="post-links" aria-labelledby="project-links-heading">
        <h2 id="project-links-heading">Links</h2>
        <ul>
$links
        </ul>
      </aside>
    </div>
  </article>
</main>
