<main class="section" id="content" tabindex="-1">
  <article class="post-detail">
    <header class="section-header">
      <p class="post-category">$category</p>
      <h1>$heading</h1>
$subtitle
      <p><time datetime="$timestamp">$date</time></p>
    </header>
    <div class="post-columns">
      <section class="post-body" aria-label="$article_label">
$note
$body
      </section>
      <aside class="post-links" aria-labelledby="post-links-heading">
        <h2 id="post-links-heading">Links</h2>
        <ul>
$links
        </ul>
      </aside>
    </div>
  </article>
</main>
